<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTML Arcade</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        body {
            padding: 20px 15px;
        }
        h1 {
            color: #00ffcc;
            margin: 0 0 6px 0;
            font-size: 2rem;
        }
        p.subtitle {
            margin: 0 0 24px 0;
            font-size: 0.95rem;
            color: #cccccc;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }
        .game-card {
            background-color: #2a2a2a;
            padding: 18px 12px;
            border-radius: 8px;
            border: 2px solid #333333;
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 65px;
        }
        .game-card:hover {
            transform: translateY(-3px);
            border-color: #00ffcc;
            background-color: #323232;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .disclaimer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #888888;
            border-top: 1px solid #333333;
            padding-top: 12px;
            width: 100%;
            max-width: 920px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <h1>🎮 Welcome to My Arcade 🎮</h1>
    <p class="subtitle">Click on any game or app below to open it instantly!</p>

    <div class="game-grid">
        <div class="game-card"><a href="UNO.html">🃏 UNO</a></div>
        <div class="game-card"><a href="airplane(real height).html">✈️ Airplane (Real Height)</a></div>
        <div class="game-card"><a href="chess.html">♔ Chess</a></div>
        <div class="game-card"><a href="cpr.html">🫀 CPR</a></div>
        <div class="game-card"><a href="dominoes.html">🀁 Dominoes</a></div>
        <div class="game-card"><a href="football.html">🏈 Football</a></div>
        <div class="game-card"><a href="minesweeper.html">💣 Minesweeper</a></div>
        <div class="game-card"><a href="penalty shootout.html">⚽ Penalty Shootout</a></div>
        <div class="game-card"><a href="pendulum.html">⏳ Pendulum</a></div>
        <div class="game-card"><a href="sim 1.html">🕹️ Sim 1</a></div>
        <div class="game-card"><a href="slow.html">🐌 Slow</a></div>
        <div class="game-card"><a href="snake.html">🐍 Snake</a></div>
        <div class="game-card"><a href="testingbaseball.html">⚾ Baseball Test</a></div>
        <div class="game-card"><a href="text-to-speech.html">🗣️ Text to Speech</a></div>
    </div>

    <p class="disclaimer">All projects made by human with the help of AI</p>

</body>
</html>
