<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Time Manipulation Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a2d3d;
        }
        canvas {
            display: block;
            background: #181a24;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(15, 16, 22, 0.75);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8fabbb;
            margin-bottom: 4px;
        }
        .status-value {
            font-size: 18px;
            font-weight: bold;
            color: #00f0ff;
        }
        #energy-container {
            width: 180px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px;
        }
        #energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            transition: width 0.1s linear;
        }
        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 16, 22, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #a0a5c0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .key-badge {
            background: #2a2d3d;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #40455f;
        }
        #time-btn {
            pointer-events: auto;
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        #time-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="ui-overlay">
            <div class="hud-panel">
                <div class="status-title">Time State</div>
                <div id="time-state" class="status-value">NORMAL</div>
            </div>

            <div class="hud-panel">
                <div class="status-title">Chrono Energy</div>
                <div id="energy-container">
                    <div id="energy-bar"></div>
                </div>
            </div>
        </div>

        <div id="controls-hint">
            <span>Press <span class="key-badge">SPACE</span> to Freeze / Slow Time</span>
            <button id="time-btn">Toggle Time</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const timeStateUI = document.getElementById('time-state');
        const energyBarUI = document.getElementById('energy-bar');
        const timeBtn = document.getElementById('time-btn');

        // Game Configuration & State
        const CONFIG = {
            npcCount: 18,
            maxEnergy: 100,
            energyDrainRate: 25, // per second
            energyRechargeRate: 15, // per second
        };

        let timeFactor = 1.0; // 1.0 = Normal, 0.1 = Slow Mo, 0.0 = Freeze
        let isTimeControlled = false;
        let energy = CONFIG.maxEnergy;
        let lastTime = performance.now();

        // Shockwave effect on toggle
        let shockwave = { active: false, x: 0, y: 0, radius: 0, maxRadius: 400 };

        // Player / Cursor Object
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 12,
            color: '#00f0ff'
        };

        // Track Mouse
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
        });

        // NPC Class (People)
        class NPC {
            constructor(id) {
                this.id = id;
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = Math.random() * (canvas.height - 60) + 30;
                this.radius = 10;
                this.baseSpeed = Math.random() * 80 + 40; // Pixels per second
                this.angle = Math.random() * Math.PI * 2;
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                
                // AI behavior timers
                this.changeDirTimer = Math.random() * 3 + 1;
                this.isTalking = false;
            }

            update(dt, effectiveTimeFactor) {
                // Apply effective speed scaled by current time factor
                const currentSpeed = this.baseSpeed * effectiveTimeFactor;

                // Update Position
                this.x += Math.cos(this.angle) * currentSpeed * dt;
                this.y += Math.sin(this.angle) * currentSpeed * dt;

                // Handle Wall Collisions
                if (this.x - this.radius < 0) { this.x = this.radius; this.angle = Math.PI - this.angle; }
                if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.angle = Math.PI - this.angle; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.angle = -this.angle; }
                if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.angle = -this.angle; }

                // AI Change Direction
                this.changeDirTimer -= dt * effectiveTimeFactor;
                if (this.changeDirTimer <= 0) {
                    this.angle += (Math.random() - 0.5) * 1.5;
                    this.changeDirTimer = Math.random() * 3 + 1;
                }
            }

            draw() {
                // Draw Shadow
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + this.radius - 2, this.radius * 0.8, this.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();

                // Draw Body
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Draw Direction Pointer (Facing)
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(
                    this.x + Math.cos(this.angle) * (this.radius + 4),
                    this.y + Math.sin(this.angle) * (this.radius + 4)
                );
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Initialize People
        const npcs = [];
        for (let i = 0; i < CONFIG.npcCount; i++) {
            npcs.push(new NPC(i));
        }

        // Toggle Time Manipulation Function
        function toggleTime() {
            if (energy <= 0 && !isTimeControlled) return;

            isTimeControlled = !isTimeControlled;

            // Shockwave setup
            shockwave.active = true;
            shockwave.x = player.x;
            shockwave.y = player.y;
            shockwave.radius = 0;
        }

        // Key Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTime();
            }
        });

        timeBtn.addEventListener('click', toggleTime);

        // Main Game Loop
        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Handle Energy & Time States
            if (isTimeControlled) {
                timeFactor = 0.05; // 5% speed (Near Freeze / Slow Motion)
                energy -= CONFIG.energyDrainRate * dt;

                if (energy <= 0) {
                    energy = 0;
                    isTimeControlled = false;
                }
            } else {
                timeFactor = 1.0; // Normal Speed
                if (energy < CONFIG.maxEnergy) {
                    energy += CONFIG.energyRechargeRate * dt;
                    if (energy > CONFIG.maxEnergy) energy = CONFIG.maxEnergy;
                }
            }

            // Update UI
            timeStateUI.innerText = isTimeControlled ? "FREEZE / SLOW" : "NORMAL";
            timeStateUI.style.color = isTimeControlled ? "#ff0055" : "#00f0ff";
            energyBarUI.style.width = `${(energy / CONFIG.maxEnergy) * 100}%`;
            if (isTimeControlled) {
                energyBarUI.style.background = 'linear-gradient(90deg, #ff0055, #ff5500)';
            } else {
                energyBarUI.style.background = 'linear-gradient(90deg, #00b4db, #0083b0)';
            }

            // --- RENDER & UPDATES ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Update & Draw NPCs
            npcs.forEach(npc => {
                npc.update(dt, timeFactor);
                npc.draw();
            });

            // Draw Player / Reticle
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Draw Shockwave Effect
            if (shockwave.active) {
                shockwave.radius += 800 * dt;
                ctx.beginPath();
                ctx.arc(shockwave.x, shockwave.y, shockwave.radius, 0, Math.PI * 2);
                ctx.strokeStyle = isTimeControlled ? 'rgba(255, 0, 85, ' + (1 - shockwave.radius / shockwave.maxRadius) + ')' 
                                                    : 'rgba(0, 240, 255, ' + (1 - shockwave.radius / shockwave.maxRadius) + ')';
                ctx.lineWidth = 4;
                ctx.stroke();

                if (shockwave.radius >= shockwave.maxRadius) {
                    shockwave.active = false;
                }
            }

            // Time Overlay Filter Vignette
            if (isTimeControlled) {
                const gradient = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 100,
                    canvas.width / 2, canvas.height / 2, canvas.width / 1.2
                );
                gradient.addColorStop(0, 'rgba(0, 10, 30, 0)');
                gradient.addColorStop(1, 'rgba(0, 180, 255, 0.25)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            requestAnimationFrame(gameLoop);
        }

        // Start Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
